// Configuración raíz de TiendaOnline
plugins {
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// Configuración inyectada en los 3 microservicios:
// servicio-clientes, servicio-inventario y servicio-pedidos.
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    group = 'com.tiendaonline'
    version = '0.1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // BD H2 solo para testing
        testRuntimeOnly 'com.h2database:h2'

        // Observabilidad
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
        implementation 'com.github.loki4j:loki-logback-appender:1.5.2'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'user.timezone', 'America/Argentina/Buenos_Aires'
        finalizedBy tasks.named('jacocoTestReport')
    }

    // Configuracion de JaCoCo
    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
    }

    // Umbral de JaCoCo
    tasks.named('jacocoTestCoverageVerification') {
        violationRules {
            rule {
                limit {
                    minimum = 0.80
                }
            }
        }
    }

}

