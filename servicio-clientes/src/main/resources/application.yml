# Configuración de servicio-clientes
server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Statsig mask-pii
statsig:
  server-secret-key: ${STATSIG_SERVER_SECRET_KEY:}

# Cliente HTTP hacia servicio-pedidos
servicios:
  pedidos:
    url: ${SERVICIO_PEDIDOS_URL:http://localhost:8083}
  timeouts:
    connect-ms: 2000
    read-ms: 3000

# Observabilidad
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true